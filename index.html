<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a2742">
<title>QG • Candidato Irresistível</title>
<style>
:root{
  --bg:#f4f7fb;--card:#ffffff;--ink:#102437;--muted:#6c7f92;--navy:#0a2742;
  --blue:#2e7ed3;--blue2:#e8f2ff;--green:#1f8a5b;--green2:#e9f7ef;
  --line:#dde6ef;--shadow:0 18px 45px rgba(18,42,70,.08)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
.hero{background:linear-gradient(135deg,#08233d,#123f6c);color:#fff;border-radius:28px;padding:30px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#9fc8f2}
h1{margin:7px 0 5px;font-size:clamp(30px,4vw,48px);line-height:1}
.hero p{margin:0;color:#c5d7e8;font-size:15px}
.progressRow{display:flex;gap:18px;align-items:center;margin-top:26px}
.progress{flex:1;height:12px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,#5eacf5,#a7d7ff);transition:width .35s ease}
.stat{text-align:right;min-width:130px}
.stat strong{font-size:25px}
.stat span{display:block;margin-top:2px;color:#b8cce0;font-size:12px}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.current{padding:30px;position:relative;overflow:hidden}
.current:after{content:"";position:absolute;right:-85px;top:-95px;width:240px;height:240px;border-radius:50%;background:var(--blue2)}
.kicker{position:relative;z-index:1;font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
.current h2{position:relative;z-index:1;margin:10px 0 8px;font-size:34px}
.current p{position:relative;z-index:1;margin:0 0 24px;color:var(--muted);font-size:16px;max-width:720px}
.btn{position:relative;z-index:1;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:15px;font-weight:900;padding:14px 20px;cursor:pointer;transition:.18s ease}
.btn:hover{transform:translateY(-1px);background:#103b63}
.side{padding:26px}
.sideTitle{font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.big{font-size:60px;line-height:1;font-weight:950;color:var(--navy);margin-top:12px}
.big small{font-size:16px;color:var(--muted)}
.side p{color:var(--muted);margin:10px 0 0}
.section{margin-top:30px}
.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sectionHead h3{margin:0;font-size:19px}
.count{font-size:12px;font-weight:900;color:var(--muted);background:#eaf0f6;border-radius:999px;padding:6px 10px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:18px}
.badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#edf3f9;color:var(--navy);font-weight:950}
.item.done{background:#fcfffd}
.item.done .badge{background:var(--green2);color:var(--green)}
.item h4{margin:0 0 4px;font-size:15px}
.item p{margin:0;color:var(--muted);font-size:13px}
.status{font-size:12px;font-weight:900;color:var(--muted)}
.done .status{color:var(--green)}
.undo{border:0;background:transparent;color:#8b9aab;font-size:12px;font-weight:800;cursor:pointer;padding:7px 0}
.undo:hover{color:#173a5c;text-decoration:underline}
.empty{padding:18px;border:1px dashed var(--line);border-radius:16px;background:#fff;color:var(--muted);font-size:14px}
.footer{text-align:center;color:#8595a5;font-size:12px;margin-top:34px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.item{grid-template-columns:50px 1fr}.status,.undo{grid-column:2}.stat{min-width:95px}.current h2{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Central de Execução</div>
    <h1>QG • Candidato Irresistível</h1>
    <p>Uma missão por vez. Concluiu, avançou.</p>
    <div class="progressRow">
      <div class="progress"><div id="bar"></div></div>
      <div class="stat"><strong id="percent">0%</strong><span id="ratio">0 de 15 concluídas</span></div>
    </div>
  </section>

  <div class="grid">
    <section class="card current" id="currentCard"></section>
    <aside class="card side">
      <div class="sideTitle">Progresso do projeto</div>
      <div class="big"><span id="doneBig">0</span><small>/15</small></div>
      <p>Sprints concluídas</p>
    </aside>
  </div>

  <section class="section">
    <div class="sectionHead"><h3>Concluídas</h3><span class="count" id="doneCount">0</span></div>
    <div class="list" id="doneList"></div>
  </section>

  <section class="section">
    <div class="sectionHead"><h3>Pendentes</h3><span class="count" id="pendingCount">0</span></div>
    <div class="list" id="pendingList"></div>
  </section>

  <div class="footer">Progresso salvo automaticamente neste navegador.</div>
</div>

<script>
const sprints = [
  {id:1,name:"Oferta",objective:"Definir exatamente o que vendemos."},
  {id:2,name:"Arquitetura do Produto",objective:"Desenhar o produto inteiro antes da produção pesada."},
  {id:3,name:"Decodificador de Vagas",objective:"Criar o primeiro motor do sistema."},
  {id:4,name:"Minerador de Experiência",objective:"Extrair valor real da trajetória do candidato."},
  {id:5,name:"Currículo Irresistível",objective:"Transformar diagnóstico + histórico em currículo forte."},
  {id:6,name:"Candidatura + Entrevista",objective:"Posicionamento, abordagem, follow-up e preparação."},
  {id:7,name:"Produto Final",objective:"Integrar playbooks, ferramentas, templates, onboarding e materiais."},
  {id:8,name:"Identidade Premium",objective:"Consolidar identidade visual e mockups."},
  {id:9,name:"Landing Page",objective:"Construir a página principal de venda."},
  {id:10,name:"VSL",objective:"Produzir narrativa e vídeo de vendas."},
  {id:11,name:"Checkout",objective:"Configurar produto, preço e pagamento."},
  {id:12,name:"Área de Membros",objective:"Organizar a experiência de entrega."},
  {id:13,name:"Criativos",objective:"Produzir anúncios e ângulos de aquisição."},
  {id:14,name:"Tracking",objective:"Configurar eventos, UTMs e mensuração."},
  {id:15,name:"Lançamento",objective:"Colocar campanha no ar e iniciar coleta de dados."}
];

const KEY = "qg_candidato_irresistivel_completed_v3";
const INITIAL = [1,2,3,4,5];

function loadCompleted(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return [...INITIAL];
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return [...INITIAL];
    return [...new Set(parsed.map(Number).filter(id => sprints.some(s => s.id === id)))].sort((a,b)=>a-b);
  } catch {
    return [...INITIAL];
  }
}

let completed = loadCompleted();

function save(){
  localStorage.setItem(KEY, JSON.stringify(completed));
}

function render(){
  const done = sprints.filter(s => completed.includes(s.id));
  const current = sprints.find(s => !completed.includes(s.id));
  const pending = current ? sprints.filter(s => !completed.includes(s.id) && s.id !== current.id) : [];
  const pct = Math.round((done.length / sprints.length) * 100);

  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("percent").textContent = pct + "%";
  document.getElementById("ratio").textContent = done.length + " de " + sprints.length + " concluídas";
  document.getElementById("doneBig").textContent = done.length;
  document.getElementById("doneCount").textContent = done.length;
  document.getElementById("pendingCount").textContent = pending.length;

  const currentCard = document.getElementById("currentCard");
  if(current){
    currentCard.innerHTML =
      '<div class="kicker">Sprint atual • ' + String(current.id).padStart(2,"0") + '</div>' +
      '<h2>' + current.name + '</h2>' +
      '<p>' + current.objective + '</p>' +
      '<button class="btn" id="finishBtn">Concluir Sprint</button>';
    document.getElementById("finishBtn").onclick = () => {
      completed = [...new Set([...completed,current.id])].sort((a,b)=>a-b);
      save();
      render();
    };
  } else {
    currentCard.innerHTML = '<div class="kicker">Projeto concluído</div><h2>Máquina no ar.</h2><p>Todas as sprints foram concluídas.</p>';
  }

  document.getElementById("doneList").innerHTML = done.length ? done.map(s =>
    '<div class="item done">' +
      '<div class="badge">✓</div>' +
      '<div><h4>' + String(s.id).padStart(2,"0") + ' • ' + s.name + '</h4><p>' + s.objective + '</p></div>' +
      '<div><div class="status">Concluída</div><button class="undo" data-id="' + s.id + '">Desfazer conclusão</button></div>' +
    '</div>'
  ).join("") : '<div class="empty">Nenhuma sprint concluída ainda.</div>';

  document.querySelectorAll(".undo").forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.dataset.id);
      completed = completed.filter(n => n < id);
      save();
      render();
    };
  });

  document.getElementById("pendingList").innerHTML = pending.length ? pending.map(s =>
    '<div class="item">' +
      '<div class="badge">' + String(s.id).padStart(2,"0") + '</div>' +
      '<div><h4>' + s.name + '</h4><p>' + s.objective + '</p></div>' +
      '<div class="status">Pendente</div>' +
    '</div>'
  ).join("") : '<div class="empty">Nenhuma sprint pendente.</div>';
}

save();
render();
</script>
</body>
</html>
